name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Cordova & Build APK
      run: |
        npm install -g cordova
        cordova create app com.apex.drone "Apex Drone"
        cd app
        cordova platform add android
        cp ../index.html ./www/index.html
        
        sed -i '/<\/widget>/i \    <preference name="Orientation" value="landscape" \/>' config.xml
        sed -i '/<\/widget>/i \    <preference name="Fullscreen" value="true" \/>' config.xml
        
        cordova build android --verbose

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: ApexDrone-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
